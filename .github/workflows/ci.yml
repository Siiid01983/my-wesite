name: CI — tests

# Runs the test suite on every push and pull request. The PHP job installs
# pdo_sqlite so the slot-capacity DB-integration tests (in-memory SQLite) that
# skip locally actually execute here — including the no-duplicate-reservation
# and closure invariants behind the booking engine.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  php-tests:
    name: PHP — slot-capacity engine (pdo_sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP 8.3 with pdo_sqlite
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, sqlite3, mbstring
          coverage: none

      - name: Confirm pdo_sqlite is loaded
        run: |
          php -r "echo implode(',', PDO::getAvailableDrivers()), PHP_EOL;"
          php -r "exit(in_array('sqlite', PDO::getAvailableDrivers(), true) ? 0 : 1);"
          echo "pdo_sqlite OK"

      - name: Lint all hm-api PHP + tests
        run: |
          for f in hm-api/*.php tests/*.test.php; do php -l "$f"; done

      - name: timeline windows (slot-gen + window CRUD, pure + DB)
        run: php tests/timeline-windows.test.php

  node-tests:
    name: Node — arch lock + slot UI + regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium (for the slot-calendar E2E)
        run: npx playwright install --with-deps chromium

      - name: Start static dev server (dataProvider browser test)
        run: |
          nohup node serve.js > /tmp/serve.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:5050/admin.html > /dev/null && break
            sleep 0.5
          done
          curl -sf http://localhost:5050/admin.html > /dev/null && echo "static server up on :5050" || (echo "server failed to start"; cat /tmp/serve.log; exit 1)

      - name: Architecture lock
        run: npm run test:arch

      - name: DataProvider unit (browser, static server)
        run: npm test

      - name: Portal self-service unit
        run: npm run test:portal

      - name: Calendar/timestamp fixes
        run: npm run test:fixes

      - name: Timeline-calendar smoke (time/pixel/date logic)
        run: npm run test:timeline-cal

      - name: Timeline-calendar E2E (headless Chromium, press-hold/drag/resize)
        run: npm run test:timeline-cal-e2e

      - name: Timeline booking payload (BookingService → start_at/duration_min)
        run: npm run test:timeline-book

      - name: Timeline booking E2E (customer slot-picker, index.html loads clean)
        run: npm run test:timeline-book-e2e

      - name: Timeline TOUCH E2E (mobile press-hold/drag/zoom/pinch via CDP)
        run: npm run test:timeline-touch

      - name: Timeline FULL-STACK integration (real client → HTTP → engine port)
        run: npm run test:timeline-integration

      - name: Timeline block / manual-booking / context-menu / close-day / sync
        run: npm run test:timeline-block

      - name: Ops calendar = shared timeline component (unified Admin+Ops)
        run: npm run test:ops-cal
