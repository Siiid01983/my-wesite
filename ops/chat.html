<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>コミュニケーションへ移動 · Hello Moving Ops</title>
  <link rel="icon" href="/assets/brand/hm-favicon.svg" type="image/svg+xml">
  <!-- Ops consolidation: the Communication Center (communication.html) is the single
       Ops conversation surface. This is a thin compatibility redirect that PRESERVES
       query parameters. Legacy ?id=<threadKey> maps to ?thread=; ?booking= / ?cid= /
       ?thread= pass through; ?ref= is dropped (the Center resolves by booking). -->
  <script>
  (function () {
    try {
      var q = new URLSearchParams(location.search);
      if (q.has('id') && !q.has('thread')) q.set('thread', q.get('id'));
      q.delete('id'); q.delete('ref');
      var qs = q.toString();
      location.replace('communication.html' + (qs ? '?' + qs : ''));
    } catch (e) { location.replace('communication.html'); }
  })();
  </script>
  <meta http-equiv="refresh" content="0; url=communication.html" />
</head>
<body>
  <noscript><a href="communication.html">コミュニケーションを開く</a></noscript>
</body>
</html>
